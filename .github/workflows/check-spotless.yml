name: Spotless Style Check

on:
  push:
    paths:
      - ".github/workflows/check-spotless.yml"
      - "**/pom.xml"
      - "**.java"
      - "**.g4"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/check-spotless.yml"
      - "**/pom.xml"
      - "**.java"
      - "**.g4"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre_job:
    # skip-duplicate-actions documents actions:write + contents:read
    # as its minimum.
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'

  build:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: 25
        distribution: 'temurin'

    - name: Check with Spotless
      run: mvn clean spotless:check



