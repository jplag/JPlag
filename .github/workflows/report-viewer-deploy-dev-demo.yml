name: Deploy Dev Demo

on:
  workflow_dispatch: # Use this to dispatch from the Actions Tab
  push:
    branches:
      - develop
      
jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 25
          distribution: 'temurin'
        
      - name: Build Assembly
        run: mvn clean package assembly:single
        
      - name: Upload Assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "JPlag"
          path: "cli/target/jplag-*-jar-with-dependencies.jar"


  run-example:
    needs: build-jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 25
          distribution: 'temurin'
      
      - name: Get JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: JPlag
      
      - name: Copy and unzip submissions
        run: unzip ./.github/workflows/files/progpedia.zip
        
      - name: Rename jar
        run: mv *.jar ./jplag.jar
  
      - name: Run JPlag
        run: java -jar jplag.jar ACCEPTED -bc base -r example
      
      - name: Upload Result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "Result"
          path: "example.jplag"
            

  build-and-deploy:
    needs: run-example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
              
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      
      - name: Download Results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Result
          path: report-viewer/report-viewer/public

      - name: Install and Build 🔧
        working-directory: report-viewer/report-viewer
        run: |
          npm install
          npm run build-dev-demo
        
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: report-viewer/report-viewer/dist
          repository-name: JPlag/DevDemo
          token: ${{ secrets.SDQ_DEV_DEPLOY_TOKEN }}
          clean: true
          single-commit: true
  
