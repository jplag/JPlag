name: Maven Build

on:
  push:
    paths:
      - ".github/workflows/build-maven.yml"
      - "**/pom.xml"
      - "**.java"
      - "**.g4"
      - "report-viewer/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/maven.yml"
      - "**/pom.xml"
      - "**.java"
      - "**.g4"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'

  build:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: 25
        distribution: 'temurin'

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "lts/*"

    - name: Run Tests
      run: mvn verify -B -U

    - name: Build Assembly
      run: mvn -Pwith-report-viewer clean package assembly:single

    - name: Upload Assembly
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: "JPlag Jar"
        path: "cli/target/jplag-*-jar-with-dependencies.jar"


